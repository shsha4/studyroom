spring:
  application:
    name: room
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/room?connectionTimeZone=Asia/Seoul
    username: room
    password: room
    hikari:
      maximum-pool-size: 5
  jpa:
    # 컨트롤러에서 지연 로딩 SQL이 뒤늦게 나가지 않게 한다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 바꾸고, Hibernate 는 맞는지만 체크한다.
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
