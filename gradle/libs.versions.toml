# 버전 숫자는 이 파일에만 적는다. 플랫폼에서 sparrow gradle/libs.versions.toml 이 맡는 자리고, 숫자도 그 파일에 맞춘다.
[versions]
# Boot 가 관리하는 Kotlin 과 같은 값이다. 플러그인 버전은 BOM 으로 못 주므로 이 값 하나로 플러그인과 라이브러리를 맞춘다.
kotlin = "2.4.21"
# JdbcClient 배치 쓰기가 든 Framework 7.1 의 짝이다. GA 전이라 sparrow 가 RC 를 쓰고, GA 가 나오면 숫자만 바꾼다.
spring-boot = "4.2.0-RC1"
spotless = "8.10.2"
# Boot BOM 이 관리하지 않아 여기서 버전을 정한다.
mockito-kotlin = "6.4.0"
# protoc·grpc 코드 생성기는 BOM 으로 버전을 못 준다. 런타임과 어긋나지 않게 Boot 4.2.0-RC1 BOM 의
# protobuf-java.version·grpc-java.version 과 같은 값을 적는다. Boot 를 올리면 BOM 을 보고 함께 바꾼다.
protobuf = "4.36.2"
grpc = "1.84.1"
# proto → Java 스텁 생성 플러그인. parrot 이 쓰는 Gradle protobuf 플러그인이다(parrot 「2.」 스텁 생성).
protobuf-plugin = "0.10.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

# 아래는 버전을 적지 않는다. 위 BOM 이 정한다.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
# 요청 DTO 의 @Valid 형식 검증을 맡는다.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# JPA 와 함께 JDBC(JdbcClient)·Hikari 도 들어온다.
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Boot 4 는 자동 설정이 모듈로 나뉘어 flyway-core 만 넣으면 기동 때 마이그레이션이 돌지 않는다. 스타터로 넣는다.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Flyway 10 부터 MySQL 지원이 별도 모듈이다.
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
# Jackson 3 는 그룹이 tools.jackson 이다. com.fasterxml.jackson 은 Jackson 2 다.
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# 스텁 jar 가 싣는 런타임. 생성된 메시지 클래스는 protobuf-java, 서버 베이스·클라이언트 스텁은 grpc-stub 에 기댄다.
protobuf-java = { module = "com.google.protobuf:protobuf-java" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
# Boot 4.1 부터 Spring gRPC 자동 설정이 Boot 안으로 들어왔다. 서버는 Netty 로 따로 포트(기본 9090)를 연다.
spring-boot-starter-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }
# 인프로세스 채널로 서버를 띄우는 슬라이스 테스트 지원(spring/06 「1.」 gRPC Adapter 행).
spring-boot-starter-grpc-server-test = { module = "org.springframework.boot:spring-boot-starter-grpc-server-test" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
